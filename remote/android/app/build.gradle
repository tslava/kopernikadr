apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

// Release signing: ~/.kopernikadr/keystore.properties (outside the repo), or the file named by
// KOPERNIKADR_KEYSTORE_PROPERTIES. Keys: storeFile (absolute, or relative to the properties
// file), storePassword, keyAlias, keyPassword. Without the file the release build stays unsigned
// (scripts/build.sh refuses to build release then). Same loader in camera-android/app/build.gradle.kts.
def releaseKeystoreProps = { ->
    def override = System.getenv('KOPERNIKADR_KEYSTORE_PROPERTIES')
    def propsFile = override ? file(override) : file("${System.getProperty('user.home')}/.kopernikadr/keystore.properties")
    if (!propsFile.isFile()) {
        if (override) throw new GradleException("KOPERNIKADR_KEYSTORE_PROPERTIES=${override}: no such file")
        return null
    }
    def props = new Properties()
    propsFile.withInputStream { props.load(it) }
    def missing = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].findAll { !props.getProperty(it)?.trim() }
    if (missing) throw new GradleException("${propsFile}: missing ${missing.join(', ')}")
    def store = new File(props.getProperty('storeFile'))
    if (!store.isAbsolute()) store = new File(propsFile.parentFile, store.path)
    if (!store.isFile()) throw new GradleException("${propsFile}: storeFile not found: ${store}")
    props.setProperty('storeFile', store.absolutePath)
    return props
}()

android {
    namespace = "pl.slava.kopernikadr.remote"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "pl.slava.kopernikadr.remote"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (releaseKeystoreProps != null) {
            release {
                storeFile file(releaseKeystoreProps.getProperty('storeFile'))
                storePassword releaseKeystoreProps.getProperty('storePassword')
                keyAlias releaseKeystoreProps.getProperty('keyAlias')
                keyPassword releaseKeystoreProps.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        debug {
            // Installs next to the release build on the same device.
            applicationIdSuffix ".debug"
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // Unsigned when there is no keystore.properties (see releaseKeystoreProps above).
            if (releaseKeystoreProps != null) signingConfig signingConfigs.release
        }
    }
}

kotlin {
    compilerOptions {
        // Matches capacitor.build.gradle's Java 21 compileOptions.
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
